# Package build on pull requests into release: the Arch package.
# release.yml publishes the artifact of the final PR head without rebuilding.
# workflow_dispatch runs it on any branch, for testing the build itself.
name: build

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# staging is the head of the staging -> release pull request, so every merge
# into staging pushes to it and starts a new build. Only the newest head
# matters, so a push cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch package (archlinux container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:latest scripts/ci/build-arch.sh
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: virt-glass-arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
